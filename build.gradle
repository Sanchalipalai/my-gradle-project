plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
}

application {
    mainClass = 'com.example.Main'
}

test {
    useJUnitPlatform()
}


jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
